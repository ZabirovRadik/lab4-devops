- name: Развёртывание lab4-service
  hosts: lab4
  become: yes
  vars:
    service_name: lab4-service
    service_dir: /opt/lab4-service
    html_dir: /opt/lab4-service/html
    service_script: /opt/lab4-service/service.sh
    healthcheck_script: /usr/local/bin/lab4-healthcheck.sh
    surname: "Zabirov"

  tasks:
    - name: Установить необходимые пакеты
      apt:
        name:
          - python3
          - git
          - curl
        state: present
        update_cache: yes

    - name: Создать каталоги сервиса
      file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      loop:
        - "{{ service_dir }}"
        - "{{ html_dir }}"

    - name: Создать index.html с моей фамилией
      copy:
        content: |
          <html>
          <head><meta charset="UTF-8"></head>
          <body><h1>{{ surname }}</h1></body>
          </html>
        dest: "{{ html_dir }}/index.html"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Скопировать service.sh
      copy:
        src: ../service/service.sh
        dest: "{{ service_script }}"
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Создать systemd unit-файл
      copy:
        content: |
          [Unit]
          Description=Lab4 HTTP Server (www-data)
          After=network.target

          [Service]
          Type=simple
          User=www-data
          Group=www-data
          ExecStart={{ service_script }}
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=yes
          PrivateTmp=yes

          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/{{ service_name }}.service"
        owner: root
        group: root
        mode: '0644'

    - name: Daemon-reload
      systemd:
        daemon_reload: yes

    - name: Сервис
      systemd:
        name: "{{ service_name }}"
        state: started
        enabled: yes

    - name: Healthcheck-скрипт
      copy:
        src: ../service/lab4-healthcheck.sh
        dest: "{{ healthcheck_script }}"
        owner: root
        group: root
        mode: '0755'
